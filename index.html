<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOH Avatar Builder (test)</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f6f0e4;color:#3b2a1e}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
header a{color:#7a3b1d;font-weight:600}
.wrap{display:flex;flex-direction:column;align-items:center}
#stage{position:relative;width:90vw;max-width:520px;aspect-ratio:1040/1664;background:#fffaf0;border-radius:16px;box-shadow:0 2px 10px #0002}
#stage img{position:absolute;inset:0;width:100%;height:100%}
.panel{width:94vw;max-width:900px;padding:8px 0 40px}
h3{margin:14px 6px 6px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;padding:0 6px}
button{border:2px solid #c9b79a;background:#fff;border-radius:12px;padding:10px 14px;font-size:15px;min-height:44px}
button.on{border-color:#7a3b1d;background:#f1dcc4;font-weight:700}
.sw{width:44px;height:44px;padding:0;border-radius:50%}
@media(min-width:900px){.wrap{flex-direction:row;align-items:flex-start;justify-content:center;gap:24px}#stage{width:min(42vw,560px)}.panel{width:44vw}}
</style></head><body>
<header><b>BOH Avatar Builder — test</b><a href="sheets/">Sheets</a></header>
<div class="wrap"><div id="stage">
<img id="hb" alt=""><img id="body" alt="avatar"><img id="hf" alt="">
</div>
<div class="panel">
<h3>Kid</h3><div class="row" id="g"></div>
<h3>Skin tone</h3><div class="row" id="t"></div>
<h3>Hairstyle</h3><div class="row" id="h"></div>
<h3>Hair color</h3><div class="row" id="c"></div>
</div></div>
<script>
const HC={natural:'#5a3a26',black:'#262020','dark-brown':'#3e2618','medium-brown':'#68402a','light-brown':'#966842',auburn:'#8c3418','dark-blonde':'#a6804e',blonde:'#d6b06c','bright-red':'#ce281a','light-brown-with-blonde-highlights':'linear-gradient(90deg,#966842 0 30%,#e8c882 30% 45%,#966842 45% 70%,#e8c882 70% 85%,#966842 85%)','blonde-on-top':'linear-gradient(180deg,#d6b06c 0 50%,#5a3a26 50%)'};
let D,S={g:'girl',t:5,h:0,c:'natural'};
const $=i=>document.getElementById(i);
function btn(p,label,on,f,st){const b=document.createElement('button');b.textContent=label;if(st){b.className='sw';b.style.background=st;b.title=label;b.textContent=''}if(on)b.classList.add('on');b.onclick=f;p.appendChild(b)}
function draw(){
 const g=S.g,n=D[g][S.h][0],t=String(S.t).padStart(2,'0');
 $('body').src=`img/${g}_body_t${t}.webp`;
 $('hb').src=`img/${g}_hair_${n}_${S.c}_back.webp`;$('hf').src=`img/${g}_hair_${n}_${S.c}_front.webp`;
 for(const k of 'gthc')$(k).innerHTML='';
 ['girl','boy'].forEach(x=>btn($('g'),x,S.g==x,()=>{S.g=x;S.h=0;draw()}));
 D.tones.forEach((rgb,i)=>btn($('t'),'Tone '+(i+1),S.t==i+1,()=>{S.t=i+1;draw()},`rgb(${rgb})`));
 D[g].forEach(([k,lab],i)=>btn($('h'),lab,S.h==i,()=>{S.h=i;draw()}));
 D.colors.forEach(c=>btn($('c'),c.replaceAll('-',' '),S.c==c,()=>{S.c=c;draw()},HC[c]));
 // preload other colors of this style
 D.colors.forEach(c=>{new Image().src=`img/${g}_hair_${n}_${c}_front.webp`});
}
fetch('data.json').then(r=>r.json()).then(d=>{D=d;draw()});
</script></body></html>
